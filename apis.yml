name: Fourier Intelligence
description: >-
  Fourier (Fourier Intelligence, founded 2015 and headquartered in Shanghai, China) is a
  full-stack robotics company that develops core robot technology and finished robot products.
  It began in rehabilitation robotics — exoskeletons and upper/lower-limb rehab devices such as
  the ArmMotus and ExoMotus lines and the RehabHub intelligent rehabilitation ecosystem — and
  has expanded into general-purpose humanoid robots (the GRx series, including GR-1 and GR-2),
  smart actuators (FSA), and dexterous hands. Fourier publishes first-party developer SDKs for
  robot control through its FFTAI GitHub organization: the RoCS (Robot Control System / General
  Robotics OS) client libraries for Python and JavaScript/TypeScript, and the fourier-grx control
  stack for the GRx humanoid series. Fourier is backed by SoftBank Vision Fund. These are
  device/robot-control developer libraries rather than a hosted web API; the company publishes no
  public REST/OpenAPI surface.
